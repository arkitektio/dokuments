postgres:
  db_name: dokuments
  engine: django.db.backends.postgresql
  host: db
  password: hello_django
  port: 5432
  username: hello_django
django:
  admin:
    email: admin@admin.com
    password: admin
    username: admin
  debug: true
  hosts:
    - "*"
  secret_key: ab94ec351412c22324b2f635e0d6b9dd
authentikate:
  # "*" accepts a token minted for any service, which is fine for the throwaway test stack.
  audience: "*"
  issuers:
    - kind: rsa
      iss: lok
      kid: lok-key-1
      public_key: ssh-rsa 
  static_tokens:
    test:
      sub: 1
      iss: lok
      roles:
        - editor
redis:
  host: redis
  port: 6379
scopes:
  dokuments_read: Read documents and their files
  dokuments_write: Write documents and their files
datalayer:
  # The scoped user configs/rustfs.yaml provisions; the server mints STS credentials per
  # grant from it (RustFS scopes the session by the inline policy, any ARN-shaped role does).
  role_arn: arn:aws:iam::000000000000:role/dokuments
  access_key: minio_access_key
  secret_key: minio_secret_key
  host: rustfs
  port: 9000
  protocol: http
  media:
    bucket: media
