projects:
  dokuments:
    # The endpoint refuses unauthenticated introspection, so the dumped SDL is the source.
    schema: schema.graphql
    documents: graphql/*/**.graphql
    extensions:
      turms:
        out_dir: dokuments/api
        exclude_typenames: true
        dump_configuration: true
        dump_schema: true
        freeze:
          enabled: true
        options:
          enabled: true
          use_enum_values: true
          populate_by_name: true
          alias_mode: split
          extra: forbid
          types:
            - input
        stylers:
          - type: turms.stylers.default.DefaultStyler
          - type: turms.stylers.appender.AppenderStyler
            append_fragment: ""
        plugins:
          - type: turms.plugins.enums.EnumsPlugin
          - type: turms.plugins.inputs.InputsPlugin
          - type: turms.plugins.fragments.FragmentsPlugin
          - type: turms.plugins.operations.OperationsPlugin
          - type: turms.plugins.client.ClientPlugin
            # Every operation is a method of DokumentsApi, which Dokuments mixes
            # in. Each method hands its operation to execute/aexecute/subscribe/
            # asubscribe of self, which the Dokuments client implements over its rath.
            client_class: DokumentsApi
            reserved_from:
              - dokuments.dokuments.Dokuments
            coercible_scalars:
              ID: rath.scalars.IDCoercible
            expand_input_types:
              - input
          # SCOPES: what the operations above need at dokuments, read off the schema's
          # `@auth(required_scopes: ...)`. The service hands it to every app's manifest.
          - type: turms.plugins.scopes.ScopesPlugin
        processors:
          - type: turms.processors.black.BlackProcessor
        scalar_definitions:
          Any: typing.Any
          FileLike: dokuments.scalars.FileLike
          ID: rath.scalars.ID
          ByteCount: int
        additional_bases:
          MediaStore:
            - dokuments.traits.HasDownloadAccessor
